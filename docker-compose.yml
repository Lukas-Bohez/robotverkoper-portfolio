# The whole of Lukas's part in Docker, and nothing of Maciej's: its own MongoDB, its own API, its own PWA.
#
#   cd Lukas
#   docker compose up --build
#
# Open http://localhost:5174 and log in with docent@howest.be or lukasbohez@gmail.com and any password (local demo logins,
# no Firebase needed). Both are superadmin of the seller panel.
# For the real thing (Firebase logins, the built PWA behind nginx) add docker-compose.firebase.yml, see Lukas/README.md.
name: robotverkoper

services:
  # Our own database (MongoDB). Not the database of Maciej: another container, another volume.
  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]
    volumes:
      - seller-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  platform-simulator:
    build: ./platform-simulator
    ports:
      - "4100:4100"
    volumes:
      - platform-data:/data
    restart: unless-stopped

  seller-api:
    build: ./seller-api
    depends_on:
      mongo:
        condition: service_healthy
      platform-simulator:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/seller
      # The demo logins accept anyone: the API refuses them when NODE_ENV=production
      AUTH_MODE: dev
      SEED_DEMO: "true"
      SELLER_ADMIN_EMAILS: ${SELLER_ADMIN_EMAILS:-docent@howest.be,lukasbohez@gmail.com}
      # Container to container
      PLATFORM_URL: http://platform-simulator:4100
      # What the robot app (on the host or on a phone) connects to: the address of the host, not of a container
      ROBOT_API_URL: ${ROBOT_API_URL:-http://localhost:4100/graphql}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - "4200:4200"
    restart: unless-stopped

  seller-pwa:
    build:
      context: ./seller-pwa
      target: dev
    depends_on:
      - seller-api
    ports:
      - "5174:5174"
    restart: unless-stopped

volumes:
  platform-data:
  seller-mongo:
