server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Every route is the same page (the router decides), except real files
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker and the manifest must never be served stale, or an update never arrives
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Built files have a hash in their name: cache them for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
